# Build the firmware and the browser emulator on every push. Pushes to main also publish a site (GitHub Pages) with:
#   /webapp/try/        the browser emulator (play the current build)
#   /webapp/installer/  the browser installer (flash the current build over USB, Chrome or Edge)
#   /webapp/editor/     the editor
#   /firmware/          the .fwsc package
name: Build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages (UI fonts and icons are rasterised at build time)
        run: pip install Pillow fonttools

      - name: Cache the JieLi toolchain and SDK files
        id: jieli
        uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-${{ hashFiles('tools/get_toolchain.sh') }}-AC79NN_SDK_V1.2.1_2023-12-13

      - name: JieLi toolchain (clang 4.0.1 for pi32v2)
        if: steps.jieli.outputs.cache-hit != 'true'
        run: tools/get_toolchain.sh

      - name: JieLi AC79 SDK (only cpu/wl82/tools is used)
        if: steps.jieli.outputs.cache-hit != 'true'
        run: |
          # gitee.com fails now and then (HTTP 500): retry with backoff. Once main has the cache, branches reuse it.
          for wait in 15 30 60 0; do
            rm -rf "$HOME/fw-AC79_AIoT_SDK"
            if git clone --depth 1 --filter=blob:none --sparse \
                 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK" &&
               git -C "$HOME/fw-AC79_AIoT_SDK" sparse-checkout set cpu/wl82/tools; then
              exit 0
            fi
            [ "$wait" = 0 ] && break
            echo "gitee clone failed; retrying in ${wait}s"; sleep "$wait"
          done
          echo "::error::could not fetch the JieLi AC79 SDK from gitee.com after 4 attempts"; exit 1

      - name: Build the firmware
        run: ./build.sh

      - uses: mymindstorm/setup-emsdk@v14

      - name: Build the browser emulator
        run: sh web/emu/build.sh

      - name: Assemble the site
        run: |
          python3 web/make_site.py build/felucca.fwsc "dev-${GITHUB_SHA::7}" site
          mkdir -p site/webapp/try
          cp -r build/emu/. site/webapp/try/
          cat > site/index.html <<HTML
          <!DOCTYPE html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>CYBERDECK ${GITHUB_SHA::7}</title>
          <style>
          body{background:#0a0a06;color:#f6f2d6;font:15px/1.6 ui-monospace,Menlo,monospace;max-width:40rem;margin:3rem auto;padding:0 1rem}
          h1{display:flex;align-items:stretch;gap:8px;margin:0 0 .3rem;font-size:1.6rem;letter-spacing:.1em}
          h1 .hatch{width:72px;background:repeating-linear-gradient(-63deg,#fcee0a 0 4px,transparent 4px 9px)}
          h1 .tag{background:#fcee0a;color:#000;padding:.2rem 1.6rem .2rem 1.1rem;clip-path:polygon(16px 0,100% 0,calc(100% - 16px) 100%,0 100%)}
          .rule{height:3px;background:#fcee0a;margin-bottom:.6rem}.ver{display:flex;justify-content:space-between}.on{color:#00e8ff}
          a.btn{display:block;background:#fcee0a;color:#000;font-weight:700;letter-spacing:.1em;text-decoration:none;
            padding:.8rem 1.2rem;margin:1.4rem 0 .3rem;clip-path:polygon(0 0,100% 0,100% 65%,calc(100% - 16px) 100%,0 100%)}
          a.btn:hover{background:#00e8ff}
          small{color:#c9c08a}.warn{color:#ff2048}
          </style></head><body>
          <h1><span class="hatch"></span><span class="tag">CYBERDECK</span></h1>
          <div class="rule"></div><div class="ver"><span>build ${GITHUB_SHA::7}</span><span class="on">ONLINE</span></div>
          <a class="btn" href="webapp/try/">&gt; PLAY IN BROWSER</a><small>the emulator: same code as the device, no CPU limit</small>
          <a class="btn" href="webapp/installer/">&gt; FLASH TO FM-1</a><small>Chrome or Edge, USB. <span class="warn">Back up first. At your own risk.</span></small>
          <a class="btn" href="webapp/editor/">&gt; EDITOR</a>
          </body></html>
          HTML

      - name: Upload the firmware files
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            build/felucca.fwsc
            build/felucca.bin
            build/loader/ota.bin

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Sound golden renders, CPU budget per preset (on the pi32v2 code), voices, UI layout. A separate job so the site does
  # not wait for it, and report only: changing a sound on purpose changes its golden hash.
  test:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages (UI fonts and icons are rasterised at build time)
        run: pip install Pillow fonttools

      - name: Cache the JieLi toolchain and SDK files
        id: jieli
        uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-${{ hashFiles('tools/get_toolchain.sh') }}-AC79NN_SDK_V1.2.1_2023-12-13

      - name: JieLi toolchain (clang 4.0.1 for pi32v2)
        if: steps.jieli.outputs.cache-hit != 'true'
        run: tools/get_toolchain.sh

      - name: JieLi AC79 SDK (only cpu/wl82/tools is used)
        if: steps.jieli.outputs.cache-hit != 'true'
        run: |
          # gitee.com fails now and then (HTTP 500): retry with backoff. Once main has the cache, branches reuse it.
          for wait in 15 30 60 0; do
            rm -rf "$HOME/fw-AC79_AIoT_SDK"
            if git clone --depth 1 --filter=blob:none --sparse \
                 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK" &&
               git -C "$HOME/fw-AC79_AIoT_SDK" sparse-checkout set cpu/wl82/tools; then
              exit 0
            fi
            [ "$wait" = 0 ] && break
            echo "gitee clone failed; retrying in ${wait}s"; sleep "$wait"
          done
          echo "::error::could not fetch the JieLi AC79 SDK from gitee.com after 4 attempts"; exit 1

      - name: Build the firmware (the tests read build/)
        run: ./build.sh

      - uses: mymindstorm/setup-emsdk@v14

      - name: Host tests
        shell: bash
        run: |
          export AC79_SDK="$HOME/fw-AC79_AIoT_SDK"
          set +e
          tests/run_tests.sh 2>&1 | tee build/host-tests.log
          status=${PIPESTATUS[0]}
          # the failing lines (a check ending FAIL, a FAILED summary, a budget miss), all in one annotation (a step shows
          # at most 10), so the run's summary and the checks API list them
          fails=$(grep -E "(FAIL|FAILED)[[:space:]]*$|FAILED|over budget \(|not in tests/" build/host-tests.log \
                  | grep -vE "[[:space:]]ok[[:space:]]*$|0 CPU entries over budget" | head -80)
          if [ -n "$fails" ]; then
            msg=$(printf '%s' "$fails" | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=host test failures::$msg"
          fi
          exit $status

      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-tests-${{ github.sha }}
          path: build/host-tests.log

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    # one deploy at a time; a newer push does not cancel an older run, so every push's tests finish
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
